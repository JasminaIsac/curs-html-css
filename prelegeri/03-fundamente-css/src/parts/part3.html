<section class="lesson" id="s8" data-num="8" data-title="Cascada: ordinea regulilor">
<script type="text/markdown">
Când două reguli cu **aceeași specificitate** stabilesc aceeași proprietate, câștigă cea scrisă **mai jos** în CSS.

De aici vine „cascadă”: stilurile se suprapun, iar ultimul strat vizibil rămâne.

Ordinea completă, pe scurt:

1. `!important`;
2. originea (stilurile tale bat stilurile implicite ale browserului);
3. specificitatea;
4. ordinea în cod.
</script>

<div class="demo" data-title="La egalitate câștigă regula de jos" data-desc="Ambele reguli sunt pe p. Câștigă a doua. Mută declarația de culoare în sus în editor și vezi că se schimbă câștigătorul." data-height="120" data-tab="css">
<script type="text/css">
p { color: #2e7d32; margin: 0; font-size: 18px; }
p { color: #1565c0; }
</script>
<script type="text/html">
<p>Două reguli p. Câștigă cea de-a doua: albastru.</p>
</script>
</div>
</section>

<section class="lesson" id="s9" data-num="9" data-title="Specificitatea">
<script type="text/markdown">
Dacă regulile diferă ca „tărie”, ordinea nu mai ajunge. Browserul numără specificitatea pe trei niveluri:

| Nivel | Ce contează | Exemplu |
|---|---|---|
| a | identificatori | `#intro` → 1,0,0 |
| b | clase, atribute, pseudo-clase | `.evid`, `[type="email"]`, `:hover` → 0,1,0 |
| c | elemente și pseudo-elemente | `p`, `::before` → 0,0,1 |

Se compară întâi **a**, apoi **b**, apoi **c**. O clasă (0,1,0) bate oricâte elemente (0,0,5). Un id (1,0,0) bate orice clasă.

Inline (`style="…"`) bate toți selectorii de mai sus. `!important` bate și inline-ul normal.

Selectorul `*` și combinatorii (` `, `>`, `+`) **nu** adaugă specificitate; elementele din ei, da (`article p` este 0,0,2).
</script>

<section class="lesson" id="s10" data-num="10" data-title="Moștenirea">
<script type="text/markdown">
Unele proprietăți se transmit de la părinte la copii. Altele nu.

| Se moștenesc | Nu se moștenesc |
|---|---|
| `color`, `font-family`, `font-size`, `font-weight` | `background`, `border`, `margin`, `padding` |
| `text-align`, `line-height`, `letter-spacing` | `width`, `height` |

De aceea `body { font-family: …; color: …; }` schimbă textul din toată pagina: paragrafele, listele și celulele moștenesc. Fundalul și bordura rămân ale părintelui.

O regulă proprie a copilului înlocuiește valoarea moștenită. Poți forța moștenirea cu `color: inherit`.
</script>

<div class="demo" data-title="Ce trece la copii" data-desc="Schimbă culoarea părintelui: textul din copil se schimbă. Bordura rămâne doar pe cutia mare." data-height="160" data-tab="css">

    color: #1565c0;
    font-family: Georgia, serif;

    padding: 12px 14px;
    border-radius: 10px;
}
.parinte p { margin: 0 0 6px; }
.copil { font-weight: 700; }
</script>
<script type="text/html">

  <p>Text moștenit: culoare și font.</p>

</div>
</script>

<section class="lesson" id="s11" data-num="11" data-title="!important">
<script type="text/markdown">
`!important` la sfârșitul valorii face ca declarația să bată regulile normale, inclusiv unele cu specificitate mai mare și chiar stilul inline (dacă inline-ul nu are și el `!important`).

```css
.buton { background: #1565c0 !important; }
```

Îl eviți în codul de zi cu zi: strică cascada și devine greu de corectat. Are sens în două situații rare: o utilitate de accesibilitate (`prefers-reduced-motion`) sau o suprascriere pe care nu o controlezi altfel. În rest, repară selectorul.
</script>

.special { color: #c62828; }
</script>
<script type="text/html">

</script>

<section class="lesson" id="s12" data-num="12" data-title="Unități: px, em, rem, %, vw și vh">
<script type="text/markdown">
| Unitate | Față de ce | La ce e bună |
|---|---|---|
| `px` | pixel | borduri, umbre, valori fine |
| `%` | dimensiunea **părintelui** | lățimi relative |
| `em` | fontul **elementului** (la `font-size`, fontul părintelui) | spații legate de text; se înmulțește la imbricare |
| `rem` | fontul lui `html` (rădăcina) | mărimi de text care nu se înmulțesc |
| `vw` / `vh` | 1% din lățimea / înălțimea **ferestrei** | secțiuni mari, titluri fluide |

`0` se scrie fără unitate. Nu pui spațiu între număr și unitate: `16px`, nu `16 px`.

`em` se compune: un copil cu `font-size: 1.2em` înăuntrul altui `1.2em` ajunge la 1,44×. `rem` rămâne raportat la `html`, deci e mai previzibil pentru text.
</script>

<section class="lesson" id="s13" data-num="13" data-title="Culori: nume, hex, rgb, hsl">
<script type="text/markdown">
| Format | Exemplu | Observație |
|---|---|---|
| nume | `crimson`, `navy` | ~140 de nume; utile la schiță |
| hex | `#1565c0`, `#fff` | `#RRGGBB`; forma scurtă `#RGB` dublează fiecare cifră |
| `rgb()` | `rgb(21, 101, 192)` | roșu, verde, albastru, fiecare 0–255 |
| `rgba()` / `rgb(… / 50%)` | transparență | ultimul canal: 0 transparent, 1 opac |
| `hsl()` | `hsl(210, 80%, 42%)` | nuanță 0–360°, saturație, luminozitate |

Același albastru poate fi scris în toate formele: `#1565c0`, `rgb(21, 101, 192)`, `hsl(210, 80%, 42%)`.

`hsl` e comod când vrei variante: păstrezi nuanța și schimbi doar luminozitatea (`42%` mai închis, `90%` pastelat).

Verifică **contrastul**: textul obișnuit ar trebui să aibă cel puțin 4,5:1 față de fundal. Text galben pe alb e greu de citit.
</script>
