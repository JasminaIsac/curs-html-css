<section class="lesson" id="s4" data-num="4" data-title="Selectorul de atribut">
<script type="text/markdown">
Alege elemente după **atribute**, fără o clasă în plus.

| Selector | Alege elementele care… |
|---|---|
| `[required]` | au atributul, indiferent de valoare |
| `[type="email"]` | au atributul **exact** cu valoarea dată |
| `[href^="https"]` | valoarea **începe** cu textul |
| `[href$=".pdf"]` | valoarea **se termină** cu textul |
| `[href*="usm"]` | valoarea **conține** textul |

Se combină cu un element: `input[type="email"]`, `a[href^="https"]`.
</script>

<div class="demo" data-title="input după type și required" data-desc="Schimbă culoarea bordurii la câmpurile obligatorii. Doar input[required] se schimbă, nu și câmpul opțional." data-height="160" data-tab="css">

input[required] { border-left: 4px solid #c62828; }

<script type="text/html">

</script>

<section class="lesson" id="s5" data-num="5" data-title="Descendent, copil, frați">
<script type="text/markdown">
Un **combinator** leagă doi selectori și descrie relația din arborele HTML. Se alege elementul din **dreapta**.

| Combinator | Scriere | Alege |
|---|---|---|
| descendent | `article p` | orice `p` din interiorul lui `article`, la orice adâncime |
| copil direct | `article > p` | `p` care este copil **direct** al lui `article` |
| frate adiacent | `h2 + p` | `p` care vine **imediat** după un `h2` |
| frate general | `h2 ~ p` | orice `p` care vine **după** un `h2`, cu același părinte |

`+` și `~` privesc doar înainte: nu poți selecta un element în funcție de frații de după el.
</script>

}
blockquote { margin: 0 0 8px; padding: 8px 10px; border-left: 3px solid #90a4ae; }
</script>
<script type="text/html">
<article>
  <p>Copil direct al article.</p>
  <blockquote>
    <p>Nepot: stă în blockquote, nu direct în article.</p>
  </blockquote>
</article>
</script>
<script type="application/json" data-knobs>
[
  {"label":"background","sel":"article p","prop":"background","options":["#fff3e0","#e3f2fd","#e8f5e9"]}
]
</script>
</div>

<section class="lesson" id="s6" data-num="6" data-title="Pseudo-clase">
<script type="text/markdown">
O **pseudo-clasă** descrie o **stare** sau o **poziție**, fără o clasă scrisă în HTML. Se scrie cu **două puncte**: `a:hover`.

| Pseudo-clasă | Când |
|---|---|
| `:hover` | mouse-ul e deasupra |
| `:focus` / `:focus-visible` | elementul are focus (câmp, link cu Tab) |
| `:active` | în momentul clicului |
| `:first-child` / `:last-child` | primul / ultimul copil |
| `:nth-child(even)` sau `(odd)` | rândurile pare / impare |
| `:not(selector)` | elementele care **nu** se potrivesc |

Pentru linkuri, ordinea utilă când le stilizezi pe toate este `:link`, `:visited`, `:hover`, `:active` (aceeași specificitate, câștigă cea scrisă mai jos).
</script>

<section class="lesson" id="s7" data-num="7" data-title="Pseudo-elemente">
<script type="text/markdown">
Un **pseudo-element** reprezintă o **parte** a elementului sau conținut **generat** de CSS. Se scrie cu **două puncte duble**: `p::first-letter`.

| Pseudo-element | Ce reprezintă |
|---|---|
| `::before` / `::after` | conținut generat înainte / după (obligatoriu `content`) |
| `::first-letter` | prima literă |
| `::first-line` | prima linie afișată |
| `::placeholder` | textul sugestie dintr-un câmp |
| `::selection` | textul selectat cu mouse-ul |

Fără `content`, `::before` și `::after` nu apar. Poți pune text (`"lei"`) sau un șir gol (`""`) pentru o linie decorativă.
</script>

<div class="demo" data-title="::before și ::after" data-desc="Schimbă textul din content și culoarea liniei de sub titlu. content este obligatoriu." data-height="160" data-tab="css">
<script type="text/css">
.pret::after {
    content: " lei";
    color: #607d8b;
    font-weight: 400;
}
h2 { margin: 0 0 8px; font-size: 1.25rem; }
h2::after {
    content: "";
    display: block;
    width: 48px;
    height: 3px;
    margin-top: 6px;
    background: #c62828;
}
.pret { font-size: 1.4rem; font-weight: 800; }
</script>
<script type="text/html">
<h2>Cană ceramică</h2>
<p class="pret">79</p>
</script>
<script type="application/json" data-knobs>
[
  {"label":"după preț","sel":".pret::after","prop":"content","options":["\" lei\"","\" MDL\"","\" €\""]},
  {"label":"linia","sel":"h2::after","prop":"background","options":["#c62828","#1565c0","#2e7d32","#e65100"]}
]
</script>
</div>
