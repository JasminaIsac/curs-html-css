<section class="lesson" id="s3" data-num="3" data-title="Imagini responsive">
<script type="text/markdown">
### 3.1. Imagini fluide

Regula minimă pe care o pui aproape în orice proiect:

```css
img, video {
    max-width: 100%;
    height: auto;
}
```

- `max-width: 100%` — nu depășește părintele (spre deosebire de `width: 800px` fix);
- `height: auto` — browserul recalculează înălțimea ca să **păstreze proporțiile** când lățimea scade.

Fără `height: auto`, dacă HTML-ul are `height="400"` și tu forțezi doar lățimea, imaginea se poate turtui.

### 3.2. `srcset` — aceeași imagine, mai multe rezoluții

Browserul alege fișierul potrivit densității ecranului sau lățimii disponibile:

```html
<img src="cana-400.jpg"
     srcset="cana-400.jpg 400w, cana-800.jpg 800w, cana-1200.jpg 1200w"
     sizes="(max-width: 600px) 100vw, 400px"
     alt="Cană ceramică">
```

- `srcset` + descriptori `w` = lățimi disponibile;
- `sizes` = cât spațiu ocupă imaginea în layout;
- `src` = rezervă pentru browsere vechi.

### 3.3. `<picture>` — art direction

Când pe mobil vrei **altă încadrare** (nu doar altă rezoluție), folosești `<picture>` cu `<source media="…">`:

<section class="lesson" id="s4" data-num="4" data-title="Variabile CSS și calc()">
<script type="text/markdown">
### 4.1. Variabile CSS (`--nume`)

Declarate de obicei pe `:root`, folosite cu `var(--nume)` sau `var(--nume, rezervă)`:

```css
:root {
    --accent: #1565c0;
    --spatiu: 16px;
}
.buton {
    background: var(--accent);
    padding: calc(var(--spatiu) / 2) var(--spatiu);
}
```

- se **moștenesc** — poți redefini `--accent` pe un părinte;
- se schimbă la **rulare** (media query, `:hover`, JavaScript);
- `calc()` combină unități: `calc(100% - 2rem)`.
</script>
<div class="demo" data-title="Variabile și moștenire" data-desc="Încearcă: schimbă --accent în :root, apoi --raza în .alerta, și urmărește ce butoane se modifică." data-height="210">

### 17.5. Temă întunecată

Cele două teme diferă doar prin valorile variabilelor. Restul CSS-ului folosește `var(...)` și nu știe ce temă e activă.
  </script>

<script type="text/markdown">
### 4.2. Temă cu variabile

Două teme = aceleași reguli, alte valori pentru `--fundal`, `--text`, `--accent`. Poți urma sistemul (`prefers-color-scheme`) sau un comutator în pagină.
</script>
<div class="demo" data-title="Temă după sistemul de operare" data-desc="Previzualizarea urmează tema sistemului tău. Schimb-o din setările sistemului (sau din DevTools → Rendering) ca să vezi cealaltă variantă." data-height="200">
    <script type="text/css">
:root {
    color-scheme: light dark;
    --fundal: #ffffff;
    --text: #263238;
    --suprafata: #f5f7fa;
}

@media (prefers-color-scheme: dark) {
    :root {
        --fundal: #121821;
        --text: #eceff1;
        --suprafata: #1c2530;
    }
}

html, body {
    background: var(--fundal);
    color: var(--text);
}

.card { background: var(--suprafata); padding: 16px; border-radius: 10px; }
    </script>
    <script type="text/html">
<div class="card">
    <h3 style="margin-top:0">Cardul meu</h3>
    <p>Culorile vin din variabile; tema sistemului alege valorile.</p>
    <input type="text" placeholder="Câmpurile native se adaptează și ele">
</div>
    </script>
  </div>
