### 0.1. Ce învățăm

Ultima prelegere din cursul HTML & CSS leagă **layout-ul** de **ecrane diferite** și de **obiceiuri de proiect**:

| Temă | Ideea |
|---|---|
| Responsive / adaptive | ce înseamnă fiecare, diferența, cum le realizezi |
| Media queries | viewport, mobile-first, breakpoint-uri |
| Unități & limite | `rem`/`%`/`vw`, `min`/`max-width`, `auto`, `clamp()` |
| Imagini | `max-width`, `srcset`, `<picture>` |

<section class="lesson" id="s1" data-num="1" data-title="Responsive vs adaptive și media queries">
<script type="text/markdown">
### 1.1. Responsive și adaptive — ce înseamnă

Ambele urmăresc același scop: pagina să fie **folosibilă pe ecrane diferite**. Diferă **cum** se potrivește layout-ul.

| | **Responsive** (receptiv / fluid) | **Adaptive** (adaptiv pe trepte) |
|---|---|---|
| Ideea | layout-ul **curge** continuu cu lățimea ferestrei | layout-ul **sare** între câteva variante discrete |
| Metaforă | apă într-un vas — se întinde / se strânge lin | trepte pe o scară — stai pe o treaptă, apoi pe alta |
| Cum se face | lățimi fluide (`%`, `fr`, `minmax`), imagini cu `max-width`, tipografie cu `clamp()`, uneori și media queries fine | **media queries** (sau detectare de dispozitiv) care schimbă numărul de coloane, meniul, ordinea blocurilor la praguri |
| Exemplu | o grilă `1fr 1fr 1fr` care se îngustează; cardurile se micșorează | sub 700px: 1 coloană; peste 700px: 2; peste 1000px: 3 |

În practică, site-urile bune sunt **amestec**: fluid (responsive) **între** praguri și salturi de layout (adaptive) **la** praguri. De aceea în vorbirea de zi cu zi „responsive design” acoperă adesea ambele.

> [!INFO]
> Nu confunda „adaptive” cu „pagină separată pentru mobil” (`m.site.com`). Acolo ai **versiuni diferite** de site. Aici vorbim de **un singur HTML/CSS** care se potrivește ecranului.

### 1.2. Cum le realizezi concret

**Responsive (fluid)** — fără să „știi” modelul de telefon:

1. `meta viewport` (obligatoriu pe mobil);
2. containere cu lățime relativă (`width: 100%`, `max-width: 1100px`), nu `width: 960px` fix;
3. Flexbox / Grid cu `fr`, `gap`, `minmax`;
4. `img { max-width: 100%; height: auto; }`;
5. tipografie fluidă: `clamp()` sau `vw` cu limite.

**Adaptive (pe trepte)** — când layout-ul trebuie să se **rearanjeze**:

1. media queries: `@media (min-width: 700px) { … }`;
2. schimbări de structură: 1 → 2 → 3 coloane, meniu hamburger → bară orizontală, sidebar care coboară sub conținut;
3. uneori `<picture>` cu `media` (altă încadrare pe mobil);
4. preferințe: `prefers-color-scheme`, `prefers-reduced-motion`.

Abordarea **mobile-first**: scrii stilul de bază pentru ecran îngust (fluid + simplu), apoi adaugi trepte adaptive cu `min-width` pe măsură ce ecranul crește.

### 1.3. Metaeticheta `viewport`

Fără această linie în `<head>`, telefoanele randează pagina ca pe un ecran larg (~980px), apoi o micșorează până textul e greu de citit:

```html
<meta name="viewport" content="width=device-width, initial-scale=1">
```

`width=device-width` aliniază lățimea CSS la lățimea ecranului; `initial-scale=1` pornește fără zoom artificial.
</script>

<div class="demo" data-title="Mobile-first: 1 → 2 → 3 coloane" data-desc="Trage de marginea previzualizării. Între praguri e fluid (responsive); la 700px și 1000px layout-ul sare pe trepte (adaptive)." data-height="300" data-layout="stack" data-resizable>

<script type="text/markdown">
### 1.4. Media queries și breakpoint-uri

| Condiție | Exemplu |
|---|---|
| lățimea ferestrei | `(min-width: 700px)`, `(max-width: 600px)` |
| orientarea | `(orientation: landscape)` |
| tip | `print`, `screen` |
| preferințe | `(prefers-color-scheme: dark)`, `(prefers-reduced-motion: reduce)` |
| indicator | `(hover: none)`, `(pointer: coarse)` |

Valori tipice: 600px, 900px, 1200px — alege-le după momentul în care **layout-ul se strică**, nu după „iPhone / iPad”.

Condiții multiple: `@media (min-width: 700px) and (max-width: 999px)`. Sintaxă modernă: `@media (700px <= width < 1000px)`.
</script>

<section class="lesson" id="s2" data-num="2" data-title="Unități, min/max, auto și clamp()">
<script type="text/markdown">
### 2.1. Unități relative

| Unitate | Față de ce | La ce e bună |
|---|---|---|
| `%` | dimensiunea **părintelui** | lățimi relative |
| `rem` | fontul lui `html` | text și spații previzibile |
| `vw` / `vh` | 1% din fereastră | secțiuni / titluri fluide |
| `px` | pixel | borduri, umbre, valori fine |

### 2.2. Fix vs. `min-*` / `max-*`

| Declarație | Comportament |
|---|---|
| `width: 400px` (fix) | **mereu** 400px — pe ecran îngust iese din pagină sau forțează scroll orizontal |
| `max-width: 400px` | „cel mult 400px”: pe ecran lat se oprește la 400; pe ecran mai îngust **se strânge** odată cu părintele (dacă mai ai `width: 100%` sau e bloc) |
| `min-width: 200px` | „cel puțin 200px”: nu se strânge sub 200, chiar dacă părintele e mai mic (poate provoca overflow) |
| `min-height` / `max-height` | aceleași idei pe verticală |

Combinația uzuală pentru un container de conținut:

```css
.continut {
    width: 100%;           /* umple părintele (fluid) */
    max-width: 1100px;     /* pe monitoare late nu se întinde la nesfârșit */
    margin-inline: auto;   /* se centrează când e mai îngust decât ecranul */
}
```

Diferența față de fix: cu `width: 1100px` pe telefon ai bară orizontală; cu `width: 100%` + `max-width: 1100px` pagina rămâne în ecran **și** arată bine pe desktop.
</script>

<script type="text/markdown">
### 2.3. Valoarea `auto` la `width` / `height`

`auto` înseamnă: **„calculează-mă tu, browserule, din context”** — nu am o lungime fixă.

| Situație | Ce face `auto` |
|---|---|
| `width: auto` pe un **bloc** | ocupă tot spațiul disponibil al părintelui (minus margini) — comportamentul implicit al `div` |
| `width: auto` pe **inline** / în flex ca item | lățimea vine din conținut (shrink-to-fit) |
| `height: auto` | înălțimea vine din **conținut** (text, imagini, padding) — crește când adaugi paragrafe |
| pe imagini: `height: auto` + `max-width: 100%` | păstrează **proporțiile** când lățimea se micșorează |

**Când o folosești (sau o lași implicită):**

- vrei ca cutia să se **adapteze la conținut** pe verticală → `height: auto` (nu `height: 400px` care taie sau lasă gol);
- la imagini fluide → `height: auto` e obligatoriu pe lângă `max-width: 100%`, altfel se turtesc;
- în Flex/Grid, `width: auto` / `height: auto` lasă itemul să urmeze regulile de `flex` / `fr`.

**Cazul „pun `auto` la tot”** (`width: auto; height: auto` pe același element):

- e aproape echivalent cu a **nu seta** deloc dimensiunile (valorile implicite sunt tot `auto`);
- elementul revine la comportamentul natural: lățime de tip bloc (sau după display), înălțime după conținut;
- util ca **reset** când o clasă anterioară pusese `width`/`height` fixe și vrei să anulezi (ex. pe mobil: `.card { width: auto; height: auto; }`);
- **nu** „centrează” și **nu** „face responsive” singur — trebuie și părinte fluid / max-width / media queries.

```css
/* pe mobil anulezi un pătrat fix de pe desktop */
@media (max-width: 600px) {
    .hero-media {
        width: auto;    /* lasă lățimea pe seama layout-ului */
        height: auto;   /* lasă înălțimea pe seama imaginii/conținutului */
        max-width: 100%;
    }
}
```
</script>

<script type="text/markdown">
### 2.4. `clamp()` — mai pe îndelete

Sintaxă:

```css
proprietate: clamp(MIN, PREFERAT, MAX);
```

Browserul alege **PREFERAT**, dar:

- dacă PREFERAT ar fi **mai mic** decât MIN → folosește MIN;
- dacă PREFERAT ar fi **mai mare** decât MAX → folosește MAX.

Exemplu tipografie:

```css
h1 {
    font-size: clamp(1.25rem, 4vw, 2.5rem);
}
```

| Parte | Rol în exemplu |
|---|---|
| `1.25rem` | pe ecran foarte îngust titlul **nu** scade sub ~20px (dacă 1rem = 16px) |
| `4vw` | „idealul” fluid: 4% din lățimea ferestrei — crește pe măsură ce lărgești |
| `2.5rem` | pe monitor lat titlul **nu** explodează peste ~40px |

Fără `clamp`, doar `font-size: 4vw` pe telefon poate fi prea mic, pe TV prea mare. Fără fluid, doar `2rem` e constant — nu profită de ecranul lat.

Poți folosi `clamp()` și la spații sau lățimi: `padding: clamp(1rem, 3vw, 2.5rem);` sau `width: clamp(16rem, 50%, 40rem);`.

> [!TIP]
> Ordinea e mereu **min, preferat, max**. Dacă greșești ordinea (ex. min > max), rezultatul e confuz — ține min ≤ max.
</script>
