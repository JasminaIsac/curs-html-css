<section class="lesson" id="s0" data-num="0" data-title="Modelul casetei">
<script type="text/markdown">
### 0.1. Cele patru straturi

Fiecare element are o **casetă** cu patru straturi, din interior spre exterior:

| Strat | Ce este |
|---|---|
| **content** | textul sau copiii elementului; `width` / `height` se referă aici (implicit) |
| **padding** | spațiul interior, între conținut și bordură |
| **border** | conturul vizibil |
| **margin** | spațiul exterior, față de frați / părinte |

Ordinea pe care o vezi în DevTools (Computed → box model) este aceeași. Fundalul (`background`) acoperă content + padding (și, cu `background-clip`, poate și bordura).
</script>

<script type="text/markdown">
### 0.2. `box-sizing`

Implicit, `width` se aplică **doar conținutului** (`content-box`): padding-ul și bordura se **adaugă** la lățime. Cu `border-box`, `width` include și padding-ul, și bordura — caseta rămâne la dimensiunea declarată.

În proiecte se pune aproape mereu:

```css
*, *::before, *::after { box-sizing: border-box; }
```
</script>

}

    height: auto;
}
</script>

<script type="text/markdown">
### Colapsarea marginilor verticale

Când două blocuri se învecinează pe verticală, marginile **nu se adună**, ci se topesc: rămâne cea mai mare. Nu se aplică în flex/grid. `padding` și `border` nu se colapsează.
</script>

<script type="text/markdown">
### 2.4. Depășirea conținutului: `overflow`

Când conținutul nu încape în caseta cu dimensiuni fixe, se aplică `overflow`:

| Valoare | Efect |
|---|---|
| `visible` (implicit) | conținutul iese în afara casetei |
| `hidden` | partea care iese se taie |
| `scroll` | apar mereu bare de derulare |
| `auto` | bare de derulare doar când e nevoie |

Se poate controla separat pe axe: `overflow-x`, `overflow-y`.
</script>
</section>


<section class="lesson" id="s1" data-num="1" data-title="Borduri, umbre și fundaluri">
<script type="text/markdown">
### 1.1. Borduri, colțuri și umbre

| Proprietate | Rol |
|---|---|
| `border` | grosime, stil (`solid`, `dashed`, `dotted`), culoare |
| `border-radius` | rotunjirea colțurilor; `999px` sau `50%` pe un pătrat → cerc |
| `box-shadow` | umbră: `offset-x offset-y blur spread culoare`; `inset` pentru umbră interioară |
| `outline` | contur **în afara** casetei, nu ocupă spațiu (util la `:focus-visible`) |

`box-shadow` nu modifică layout-ul: elementul rămâne pe același loc. Poți pune mai multe umbre, separate prin virgulă.
</script>

<script type="text/markdown">
### Fundaluri în profunzime

Pe lângă `background-color`, `-image`, `-repeat`, `-position`, `-size`, există câteva proprietăți utile.

### 1.2. Zona fundalului: `background-clip` și `background-origin`

- `background-clip` stabilește până unde se **desenează** fundalul: `border-box` (implicit, până sub bordură), `padding-box`, `content-box`;
- `background-origin` stabilește de unde se **măsoară** poziția imaginii: `padding-box` (implicit), `border-box`, `content-box`.
</script>

    background-size: 30px 30px;
    background-repeat: no-repeat;
    background-clip: content-box;   /* culoarea apare doar în interior, nu și sub padding */
    background-origin: padding-box;
}
</script>

</script>

<script type="text/markdown">
### 1.3. Gradienți

Gradientul este o „imagine" generată de CSS; se pune la `background-image` (sau în prescurtarea `background`).

- unghiul `0deg` este „în sus", `90deg` spre dreapta;
- se pot pune puncte de oprire: `linear-gradient(#f00 0%, #ff0 40%, #0f0 100%)`;
- gradientul cu două culori la aceeași poziție dă o **margine netă**: `linear-gradient(90deg, red 50%, blue 50%)`.
</script>

<section class="lesson" id="s2" data-num="2" data-title="display și overflow">
<script type="text/markdown">
### `display`: block, inline, inline-block, none

| Valoare | Comportament |
|---|---|
| `block` | rând nou, acceptă `width` / `height` / margini |
| `inline` | în rândul textului; ignoră `width`, `height`, margini verticale |
| `inline-block` | în rând, dar cu dimensiuni ca la bloc |
| `none` | dispare din pagină (nu ocupă spațiu) |
| `flex` / `grid` | containere de layout (le vedem mai jos) |
</script>

<script type="text/markdown">
### 2.2. Cum ascunzi un element

| Metodă | Ocupă spațiu? | Se poate da clic? | Cititoarele de ecran |
|---|---|---|---|
| `display: none` | nu | nu | îl ignoră |
| `visibility: hidden` | da (locul rămâne gol) | nu | îl ignoră |
| `opacity: 0` | da | **da** | îl citesc |
| atributul HTML `hidden` | nu (echivalent cu `display: none`) | nu | îl ignoră |

`opacity: 0` este singura variantă care se poate **anima** (ex. dispariție treptată), de aceea se folosește la tranziții și la indicii care apar la `:hover`.
</script>

<script type="text/markdown">
### Cum ascunzi un element

`display: none` scoate elementul din layout. `visibility: hidden` lasă locul gol. `opacity: 0` lasă elementul clicabil și se poate anima. Atributul HTML `hidden` e echivalent cu `display: none`.
</script>

<script type="text/markdown">
### 2.3. Colapsarea marginilor verticale

Când două blocuri se învecinează pe verticală, marginile lor **nu se adună**, ci se „topesc": rămâne cea mai mare.

Reguli:

- se aplică doar marginilor **verticale** ale elementelor bloc din fluxul normal;
- **nu** se aplică la elementele flex sau grid, nici între elemente cu `padding`/`border` între ele;
- `padding` nu se colapsează niciodată;
- dacă vrei distanțe previzibile, folosește `gap` (la flex/grid) sau pune marginea doar pe o latură.
</script>

### 2.5. Dimensiuni: limite și proporții

`max-width` lasă caseta să se micșoreze pe ecrane înguste, `min-height` îi dă o înălțime minimă care poate crește, iar `aspect-ratio` păstrează proporția lățime/înălțime.
