<section class="lesson" id="s3" data-num="3" data-title="Flexbox">
  <script type="text/markdown">
### 3.1. Cele două axe

Un container flex are o **axă principală** (în direcția `flex-direction`) și o **axă secundară** (perpendiculară). Alinierea pe axa principală se face cu `justify-content`, pe cea secundară cu `align-items`. Dacă pui `flex-direction: column`, rolurile se inversează.

```text
flex-direction: row            flex-direction: column
 axa principală →               axa principală ↓
 axa secundară ↓                axa secundară →
```

### 3.2. Proprietăți pentru container

| Proprietate | Valori | Rol |
|---|---|---|
| `flex-direction` | `row`, `row-reverse`, `column`, `column-reverse` | direcția axei principale |
| `flex-wrap` | `nowrap`, `wrap`, `wrap-reverse` | permite trecerea pe rândul următor |
| `flex-flow` | `row wrap` | prescurtare pentru cele două de mai sus |
| `justify-content` | `flex-start`, `center`, `flex-end`, `space-between`, `space-around`, `space-evenly` | aliniere pe axa principală |
| `align-items` | `stretch` (implicit), `center`, `flex-start`, `flex-end`, `baseline` | aliniere pe axa secundară, pentru fiecare rând |
| `align-content` | ca la `justify-content` | aliniere a **rândurilor** între ele (doar cu `wrap`) |
| `gap`, `row-gap`, `column-gap` | `16px` | spațiul dintre elemente |

Joacă-te cu toate proprietățile containerului în același loc. Observă cum, la `flex-direction: column`, `justify-content` lucrează pe verticală, iar `align-items` pe orizontală.
  </script>

Diferența dintre `space-between`, `space-around` și `space-evenly`:

```text

space-evenly  : |  A   B   C  |      (spații egale peste tot)
```

  <script type="text/markdown">
### 3.3. Proprietăți pentru elementele flex

| Proprietate | Rol |
|---|---|
| `flex-grow` | cât din spațiul liber primește elementul (număr; implicit 0) |
| `flex-shrink` | cât se micșorează când nu încape (implicit 1) |
| `flex-basis` | dimensiunea de pornire (`auto`, `200px`, `30%`) |
| `flex` | prescurtare: `flex: grow shrink basis` |
| `align-self` | aliniere proprie pe axa secundară (înlocuiește `align-items`) |
| `order` | ordinea vizuală (implicit 0; numere mai mici = mai devreme) |

Forme uzuale ale prescurtării:

| Scriere | Înseamnă | Efect |
|---|---|---|
| `flex: 1` | `1 1 0%` | împarte egal spațiul rămas |
| `flex: auto` | `1 1 auto` | pornește de la dimensiunea conținutului și apoi crește |
| `flex: none` | `0 0 auto` | dimensiune rigidă, după conținut |
| `flex: 0 0 125px` | | lățime fixă de 125px |

Diferența dintre `flex: 1` și `flex: auto` se vede când elementele au conținut de lungimi diferite: cu `flex: 1` toate ajung la aceeași lățime (baza e `0%`), cu `flex: auto` cel cu text mai lung rămâne mai lat.
  </script>

  <div class="demo" data-title="flex: 1 vs auto vs none vs 0 0 125px" data-desc="Încearcă: schimbă din knob valoarea flex pentru rândul de sus și compară cu rândurile fixe de dedesubt." data-height="300" data-layout="stack">
    <script type="text/css" data-hidden>

### 3.3.1. Marginile `auto` în flexbox

Un `margin-left: auto` pe un element flex absoarbe tot spațiul liber din stânga și îl împinge la capăt:
  </script>

  <div class="demo" data-title="margin-left: auto împinge „Ieșire” la dreapta" data-desc="Încearcă: mută clasa iesire pe „Comenzi” — tot ce urmează după el ajunge în dreapta." data-height="120">

.bara a { color: #cfd8dc; text-decoration: none; }

.bara .iesire { background: #c62828; color: #fff; padding: 4px 12px; border-radius: 6px; }
    </script>

    </script>

  <script type="text/markdown">
Un `margin-top: auto` pe ultimul element dintr-o coloană flex îl lipește de fund (util pentru subsolul unui card) — vezi rețetele din 6.5.

### 3.4. Problema `min-width: 0`

Un element flex nu se micșorează sub dimensiunea conținutului său minim (de exemplu un cuvânt foarte lung sau un `input`). Dacă un câmp „iese" din container, scrie `min-width: 0` pe elementul flex. Aceeași problemă apare la `fieldset`, care are implicit o lățime minimă egală cu conținutul: `fieldset { min-width: 0; }`.
  </script>

  <div class="demo" data-title="min-width: 0 — înainte și după" data-desc="Încearcă: șterge min-width: 0 din .dupa .text și vezi cum și al doilea card iese din cadru." data-height="250" data-resizable>

    </script>
