<section class="lesson" id="s0" data-num="0" data-title="Obiective">
<script type="text/markdown">
### 0.1. Ce învățăm

După layout cu Flexbox și Grid, urmează **unde** stau elementele față de pagină și cum **se mișcă** lin:

| Temă | Ideea |
|---|---|
| `position` | static, relative, absolute, fixed, sticky; `inset`; `z-index` |
| float (istoric) | text în jurul imaginii — layout-ul modern e flex/grid |
| stări | `:hover`, `:focus`, `:active` pe linkuri și butoane |
| `transform` | translate, rotate, scale, skew — fără a muta vecinii |
| `transition` | schimbări line între stări |
| `@keyframes` | animații cu pași, iterații, direcție, fill-mode |
| performanță | animă `transform` și `opacity`; respectă `prefers-reduced-motion` |

Exemplele de la final: meniu dropdown, buton cu hover, card care se întoarce, loader, bară sticky/fixed.
</script>
</section>


<section class="lesson" id="s1" data-num="1" data-title="Poziționarea elementelor">
<script type="text/markdown">
Proprietatea `position` scoate elementele din fluxul normal și le așază după reguli proprii.

### 1.1. Valorile lui `position`

| Valoare | Comportament |
|---|---|
| `static` (implicit) | flux normal; `top`/`left` nu au efect |
| `relative` | rămâne în flux (își păstrează locul), dar poate fi **deplasat** față de poziția normală |
| `absolute` | **iese din flux**; se poziționează față de cel mai apropiat strămoș poziționat (non-`static`) |
| `fixed` | iese din flux; se poziționează față de **fereastra** browserului și rămâne pe loc la derulare |
| `sticky` | se comportă ca `relative`, până când ajunge la un prag, apoi „se lipește" |

Deplasarea se face cu `top`, `right`, `bottom`, `left` (sau scurt, `inset`).
</script>

<script type="text/markdown">
### 1.4. Ordinea pe adâncime: `z-index`

Elementele poziționate se pot suprapune. Care apare deasupra se decide cu `z-index` (număr întreg; mai mare = mai sus).

Reguli:

- `z-index` are efect doar la elemente poziționate (non-`static`) și la elemente flex/grid;
- fără `z-index`, elementele mai târzii în cod apar deasupra;
- valorile se compară doar în interiorul aceluiași **context de stivuire**. Un context nou apare, de exemplu, la un element cu `position` + `z-index`, la `opacity` sub 1, la `transform`, la `filter`. Un `z-index: 9999` într-un context nu poate depăși un element din alt context mai de sus;
- evită valorile uriașe; folosește o scară mică (`1`, `10`, `100`).
</script>

<script type="text/markdown">

| Scop | Soluție |
|---|---|

<section class="lesson" id="s2" data-num="2" data-title="Float și clear (istoric)">
<script type="text/markdown">
### Ce este `float`, pe scurt

`float` spune browserului: **„lipește acest element la stânga (sau la dreapta) și lasă textul să curgă pe lângă el”**.

Imaginează o fotografie în ziar: poza e pe o parte, iar articolul o **înconjoară**. Exact asta face `float` pe web.

### Ce se întâmplă tehnic

1. Elementul cu `float` este **scos parțial din fluxul normal** — frații ulteriori pot urca pe lângă el.
2. Este împins la **marginea stângă** (`float: left`) sau **dreaptă** (`float: right`) a containerului.
3. Conținutul care urmează (paragrafe, inline) **umple spațiul liber** de lângă el.
4. Cu `float: none` (implicit) elementul stă din nou în flux, ca orice bloc obișnuit.

### Context istoric

Înainte de Flexbox și Grid, layout-ul de pagină se făcea adesea cu `float` (coloane, meniuri). Astăzi **nu** mai e metoda potrivită pentru layout-ul paginii — rămâne util mai ales pentru **text în jurul unei imagini** (sau o inițială tipografică).

| Proprietate | Rol |
|---|---|
| `float: left` | lipește elementul la stânga; textul curge în dreapta lui |
| `float: right` | lipește la dreapta; textul curge în stânga |
| `float: none` | fără float — comportament normal |
| `clear: left \| right \| both` | următorul element **nu** mai stă pe lângă float: începe **sub** el |
| `display: flow-root` | pe container: înălțimea include copiii flotante (înlocuiește clearfix) |

**De ce există `clear`?** Dacă o notă / un buton trebuie să înceapă **sub** imagine (nu pe lângă ea), pui `clear: both` pe acel element.

> [!WARN]
> Nu construi layout-uri de pagină cu float — folosește **Flexbox** / **Grid**.
</script>

<section class="lesson" id="s3" data-num="3" data-title="Stări interactive">
<script type="text/markdown">
### `:hover`, `:focus`, `:active`

Pe elementele interactive (linkuri, butoane, câmpuri) stilurile se schimbă după starea utilizatorului:

| Pseudo-clasă | Când |
|---|---|
| `:hover` | cursorul e deasupra |
| `:focus` / `:focus-visible` | elementul e focalizat (Tab, clic pe câmp); preferă `:focus-visible` pentru contur |
| `:active` | în timpul apăsării |

Pentru linkuri, ordinea clasică e **LVHA**: `:link`, `:visited`, `:hover`, `:active`. Pune `:focus` / `:focus-visible` înaintea lui `:hover`.
</script>

    color: #fff;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
}

.btn:hover {
    background: #0d47a1;
    box-shadow: 0 4px 12px rgba(21, 101, 192, 0.4);
}

.btn:focus-visible {
    outline: 3px solid #90caf9;
    outline-offset: 3px;
}

.btn:active {
    background: #0277bd;
    transform: scale(0.97);
}
</script>
<script type="text/html">
<button class="btn" type="button">Adaugă în coș</button>
</script>
