  <script type="text/markdown">
### 4.1. `transform`

Schimbă **aspectul** unui element (poziție, mărime, înclinare, rotație) fără să afecteze restul paginii: elementul își păstrează locul în flux.

| Funcție | Efect |
|---|---|
| `translate(x, y)`, `translateX()`, `translateY()` | mută |
| `scale(s)`, `scaleX()`, `scaleY()` | mărește sau micșorează |
| `rotate(45deg)` | rotește |
| `skew(10deg, 0)` | înclină |
  </script>

  <div class="demo" data-title="Funcțiile transform" data-desc="Încearcă: alege funcții diferite — conturul punctat arată locul inițial, iar vecinii nu se mișcă." data-height="230">
    <script type="text/css" data-hidden>
.scena { display: flex; gap: 24px; padding: 40px 20px; }
.loc { outline: 2px dashed #b0bec5; border-radius: 8px; }
.loc > .b { width: 90px; height: 70px; display: grid; place-items: center; }
    </script>
    <script type="text/css">
.mutat {
    transform: translate(20px, -10px);
    transition: transform 0.3s;
}
    </script>
    <script type="text/html">
<div class="scena">
    <div class="loc"><div class="b b2">vecin</div></div>
    <div class="loc"><div class="b b1 mutat">eu</div></div>
    <div class="loc"><div class="b b2">vecin</div></div>
</div>
    </script>
    <script type="application/json" data-knobs>
[{"label":"transform","sel":".mutat","prop":"transform","options":["translate(20px, -10px)","scale(1.2)","rotate(-5deg)","rotate(45deg)","skew(10deg, 0)","translateY(-4px) scale(1.05) rotate(2deg)","none"]}]
    </script>
  </div>

  <script type="text/markdown">
- **ordinea contează**: `translateX(50px) rotate(45deg)` ≠ `rotate(45deg) translateX(50px)` (transformările se aplică de la dreapta la stânga, în sistemul de coordonate deja transformat);
- punctul față de care se transformă este implicit centrul; se schimbă cu `transform-origin: left top;`;
- `translate(50%, 50%)` folosește procente din dimensiunea **propriului element**, de aceea trucul de centrare cu `translate(-50%, -50%)` funcționează;
- un element cu `transform` creează un context de stivuire nou (vezi `z-index`).
  </script>

### 4.2. `transition`

Fără tranziție, schimbarea între două stări (de exemplu la `:hover`) este bruscă. Cu `transition`, browserul calculează valorile intermediare.

Părțile prescurtării: `transition: proprietate durată funcție-timp întârziere;`

| Proprietate | Rol |
|---|---|
| `transition-property` | ce proprietăți se animă (`all`, `opacity`, `background-color`...) |
| `transition-duration` | durata (`0.3s`, `300ms`) |
| `transition-timing-function` | ritmul: `linear`, `ease` (implicit), `ease-in`, `ease-out`, `ease-in-out`, `cubic-bezier(...)`, `steps(n)` |
| `transition-delay` | întârzierea înainte de pornire |

Mai multe proprietăți se separă prin virgulă: `transition: transform 0.2s, box-shadow 0.2s;`
  </script>

  <div class="demo" data-title="Cursa funcțiilor de timp" data-desc="Încearcă: ține mouse-ul peste pistă — toate bilele pleacă deodată și ajung deodată, dar cu ritmuri diferite." data-height="330" data-layout="stack">
    <script type="text/css" data-hidden>
.pista { border: 2px dashed #b0bec5; border-radius: 10px; padding: 10px 10px 10px 130px; cursor: pointer; }
.linie { position: relative; height: 34px; border-bottom: 1px solid #eceff1; }
.linie::before { content: attr(data-f); position: absolute; left: -120px; top: 8px; font: 12px monospace; color: #607d8b; }
.bila { position: absolute; top: 5px; left: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--c, #1565c0); }
.pista p { margin: 0 0 6px -120px; font-size: 13px; color: #607d8b; }
    </script>
    <script type="text/css">
.bila {
    transition: left 1.5s;
}
.pista:hover .bila { left: calc(100% - 24px); }

.linear  { transition-timing-function: linear; }
.ease    { transition-timing-function: ease; }
.in      { transition-timing-function: ease-in; }
.out     { transition-timing-function: ease-out; }
.in-out  { transition-timing-function: ease-in-out; }
.bezier  { transition-timing-function: cubic-bezier(.68, -0.6, .32, 1.6); }
.steps   { transition-timing-function: steps(5); }
    </script>
    <script type="text/html">
<div class="pista">
    <p>Ține mouse-ul aici ↓</p>
    <div class="linie" data-f="linear"><div class="bila linear"></div></div>
    <div class="linie" data-f="ease"><div class="bila ease" style="--c:#00897b"></div></div>
    <div class="linie" data-f="ease-in"><div class="bila in" style="--c:#f4511e"></div></div>
    <div class="linie" data-f="ease-out"><div class="bila out" style="--c:#8e24aa"></div></div>
    <div class="linie" data-f="ease-in-out"><div class="bila in-out" style="--c:#f9a825"></div></div>
    <div class="linie" data-f="cubic-bezier"><div class="bila bezier" style="--c:#c62828"></div></div>
    <div class="linie" data-f="steps(5)"><div class="bila steps" style="--c:#263238"></div></div>
</div>
    </script>
  </div>

  <script type="text/markdown">
Reguli importante:

- tranziția se scrie pe **starea de bază** (nu doar pe `:hover`), ca să funcționeze și la revenire;
- se pot anima proprietăți cu valori numerice sau de culoare (`opacity`, `transform`, `color`, `background-color`, `width`, `box-shadow`...). Nu se poate anima `display`;
- `transition: all` e comod, dar animă și proprietăți nedorite și poate încetini pagina; enumeră proprietățile;
- pentru performanță, animă în special `transform` și `opacity`: sunt cele mai ieftine pentru browser.
  </script>

  <div class="demo" data-title="display nu se animă, opacity da" data-desc="Încearcă: treci cu mouse-ul peste ambele butoane — stânga apare brusc, dreapta treptat." data-height="190">
    <script type="text/css" data-hidden>

.tinta { position: relative; padding: 8px 14px; border-radius: 6px; background: #eceff1; }

    </script>
    <script type="text/css">
/* nu merge: display trece brusc */
.cu-display .indiciu { display: none; transition: display 0.4s; }
.cu-display:hover .indiciu { display: block; }

/* merge: opacity + visibility */
.cu-opacitate .indiciu {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s, visibility 0.4s;
}

</div>
    </script>

### 4.4. Respectarea preferințelor utilizatorului

Unii utilizatori suferă de rău de mișcare sau au setat în sistem „reduce mișcarea". Respectă setarea:

```css
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
    }
}
```

> [!INFO] Demonstrația de mai jos se oprește dacă ai activat „reduce mișcarea” în sistem (Windows: Setări → Accesibilitate → Efecte vizuale; macOS: Accesibilitate → Afișaj; GNOME: Accesibilitate → Animații dezactivate).
  </script>

  <div class="demo" data-title="prefers-reduced-motion" data-desc="Încearcă: activează „reduce mișcarea” în sistem și apasă Replay." data-height="140">
    <script type="text/css">
.minge {
    width: 40px; height: 40px; border-radius: 50%;
    background: #1565c0;
    animation: sari 0.8s ease-in-out infinite alternate;
}
@keyframes sari { to { transform: translateX(220px); } }

.stare::after { content: "Mișcare normală"; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition: none !important;
        animation: none !important;
    }
    .stare::after { content: "Mișcare redusă — animația e oprită"; }
}
    </script>
    <script type="text/html">
<div class="minge"></div>
<p class="stare muted"></p>
    </script>
