<section class="lesson" id="s5" data-num="5" data-title="Tabele HTML">
<script type="text/markdown">
### 5.1. Tabele pentru date, nu pentru layout

Un `<table>` descrie **date tabulare** (rânduri × coloane cu relație). Nu-l folosi ca să pui două coloane de layout pe o pagină modernă — pentru asta există CSS (flexbox / grid).

| Potrivit pentru tabel | Nepotrivit |
|---|---|
| orar, catalog, prețuri, rezultate | meniu pe două coloane, „carduri”, întreaga pagină |

### 5.2. Anatomia minimă

| Tag | Rol |
|---|---|
| `<table>` | containerul |
| `<caption>` | titlul tabelului (vizibil + citit de cititoare) |
| `<tr>` | un rând |
| `<th>` | celulă de **antet** (implicit îngroșat, centrat) |
| `<td>` | celulă de **date** |

```html
<table>
  <caption>Prețuri — ceramică</caption>
  <tr>
    <th>Produs</th>
    <th>Preț</th>
  </tr>
  <tr>
    <td>Cană</td>
    <td>79 lei</td>
  </tr>
</table>
```
</script>

<section class="lesson" id="s6" data-num="6" data-title="thead, tbody, tfoot">
<script type="text/markdown">
### 6.1. De ce le folosim

Nu schimbă neapărat aspectul, dar:

- separă **antetul**, **datele** și **subsolul** (totaluri);
- permit stilizare clară (`thead th { … }`);
- ajută cititoarele de ecran să anunțe structura;
- la tabele lungi, unele browsere pot repeta antetul la tipărire.

### 6.2. Ordinea în markup

În HTML, ordinea recomandată în `<table>` este:

1. `<caption>` (dacă există)
2. `<thead>`
3. `<tbody>` (poți avea mai multe)
4. `<tfoot>` — în HTML5 poate apărea și **înainte** de `tbody` în sursă; browserul îl afișează tot jos

> [!TIP] Pune întotdeauna celulele de antet în `thead` cu `<th>`, nu cu `<td>` îngroșat din CSS.
</script>

<section class="lesson" id="s7" data-num="7" data-title="colspan și rowspan">
<script type="text/markdown">
### 7.1. Unirea celulelor

| Atribut | Efect |
|---|---|
| `colspan="n"` | celula acoperă **n coloane** pe orizontală |
| `rowspan="n"` | celula acoperă **n rânduri** pe verticală |

Când folosești `rowspan` / `colspan`, **nu mai scrii** celulele pe care le-ai „acoperit” — altfel tabelul se strică.

### 7.2. Exemplu mental

Pentru o familie cu doi copii, „Nume părinte” și „Adresă” apar o singură dată (rowspan=2), iar fiecare copil pe rândul lui.
</script>

<section class="lesson" id="s8" data-num="8" data-title="Tabele accesibile">
<script type="text/markdown">
### 8.1. Ce înseamnă `scope`

Un `<th>` este o **etichetă** pentru alte celule. Atributul `scope` spune **pe ce direcție** se aplică eticheta — ca un cititor de ecran să anunțe corect, de exemplu: „Categorie: Ceramică, În stoc: 24”, nu doar „24”.

| Valoare | Sens | Exemplu |
|---|---|---|
| `scope="col"` | antetul descrie **toată coloana** de sub el | „Preț” deasupra tuturor prețurilor |
| `scope="row"` | antetul descrie **tot rândul** din dreapta lui | „Ceramică” în fața cifrelor acelui rând |
| `scope="colgroup"` / `rowgroup` | pentru tabele complexe, cu grupuri de coloane/rânduri | mai rar la început |

Fără `scope`, tabelul poate arăta la fel pe ecran, dar tehnologiile asistive nu mai știu clar ce antet ține de ce celulă. Pentru tabele simple: `scope="col"` pe anteturile din prima linie; `scope="row"` pe prima celulă a rândului, dacă e etichetă (nu dată).

### 8.2. Checklist rapid

- ai `<caption>` (sau, în lipsă, un `aria-label` / `aria-labelledby` pe `table`);
- anteturile sunt `<th>`, nu `<td>` stilizate;
- `scope` e setat pe `th`;
- nu folosești tabelul pentru layout;
- pe ecrane înguste, un wrapper cu `overflow-x: auto` e mai bun decât a micșora textul ilizibil.
</script>

<div class="demo" data-title="Anteturi pe coloană și pe rând" data-desc="Încearcă: șterge scope de pe th — tabelul arată la fel vizual, dar pierde informația pentru cititoare." data-height="260" data-tab="html">
<script type="text/css" data-hidden>
table { border-collapse: collapse; width: 100%; max-width: 480px; font-size: 14px; }
caption { font-weight: 700; text-align: left; padding-bottom: 8px; color: #1565c0; }
th, td { border: 1px solid #cfd8dc; padding: 8px 10px; }
th[scope="col"] { background: #1565c0; color: #fff; }
th[scope="row"] { background: #e3f2fd; text-align: left; }
</script>
<script type="text/css">
th[scope="col"] { background: #1565c0; }
</script>
<script type="text/html">
<table>
  <caption>Stoc pe categorii</caption>
  <thead>
    <tr>
      <th scope="col">Categorie</th>
      <th scope="col">În stoc</th>
      <th scope="col">Rezervat</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">Ceramică</th>
      <td>24</td>
      <td>3</td>
    </tr>
    <tr>
      <th scope="row">Lumânări</th>
      <td>40</td>
      <td>8</td>
    </tr>
  </tbody>
</table>
</script>
