<section class="lesson" id="s0" data-num="0" data-title="Ce urmează după Prelegerea 1">
<script type="text/markdown">
### 0.1. Unde ne aflăm

În Prelegerea 1 ai învățat scheletul unui document HTML5, textul, listele, legăturile și imaginile. Browserul afișează însă la fel de bine și o pagină făcută doar din `div` și `span`. Diferența apare când:

- un **cititor de ecran** trebuie să sară la meniu sau la conținutul principal;
- un **motor de căutare** vrea să înțeleagă ce e articol, ce e navigare;
- tu (sau colegul) trebuie să **întreții** o pagină peste câteva luni.

### 0.2. Obiectivele prelegerii

| Temă | Ce vei putea face |
|---|---|
| HTML semantic | alege landmark-urile potrivite (`header`, `nav`, `main`…) în loc de `div` generice |
| Tabele | structurezi date tabelare cu `thead`/`tbody`, `colspan`/`rowspan` și `scope` |
| Formulare | construiești un formular complet, cu `label`, tipuri potrivite și validare nativă |
| Media | inserezi `audio`, `video` și `iframe` corect |
| A11y + SEO | aplici `alt`, o ierarhie de titluri curată, ARIA de bază și metadate esențiale |

> [!INFO] **Instrumente**  
> Pe lângă browser + DevTools (F12), merită să ai la îndemână [validator.w3.org](https://validator.w3.org/) și, opțional, o extensie de accesibilitate (axe, WAVE) sau panoul Lighthouse → Accessibility.
</script>
</section>

<section class="lesson" id="s1" data-num="1" data-title="De ce HTML semantic">
<script type="text/markdown">
### 1.1. Semantic vs. prezentare

**HTML semantic** = alegi tagul după **sens**, nu după cum arată. Aspectul rămâne treaba CSS-ului.

| Abordare | Exemplu | Probleme |
|---|---|---|
| Doar prezentare | `<div class="titlu-mare">Magazin</div>` | fără ierarhie pentru cititoare / SEO |
| Semantică | `<h1>Magazin</h1>` | sens clar; stilul îl pui separat |

`div` și `span` rămân utile ca **recipiente fără sens propriu** — când nu există un element semantic potrivit.

### 1.2. Ce câștigi concret

1. **Accesibilitate** — cititoarele de ecran anunță „navigation”, „main”, „banner”; utilizatorul sare direct la zona dorită.
2. **SEO** — motoarele de căutare înțeleg mai bine structura (articol, navigare, conținut principal).
3. **Mentenanță** — citind markup-ul, vezi intenția, nu doar o grămadă de `div`.
4. **Implicit mai bun** — unele taguri aduc stiluri și comportamente utile (`nav` în liste, `button` vs `div` clicabil).

### 1.3. Landmark-uri (pe scurt)

Un **landmark** (în română: „punct de reper“ sau „regiune de reper“) este o zonă mare și importantă a paginii, marcată astfel încât tehnologiile asistive (cititoarele de ecran, de exemplu) să o recunoască și să permită utilizatorului să sară direct la ea, fără să citească toată pagina de la început.

Browserul și tehnologiile asistive tratează anumite elemente HTML ca landmark-uri:

| Element | Rol tipic (landmark) |
|---|---|
| `<header>` | antetul paginii sau al unei secțiuni |
| `<nav>` | zonă de navigare principală |
| `<main>` | conținutul principal (unul pe pagină) |
| `<aside>` | conținut complementar (sidebar, legături laterale) |
| `<footer>` | subsolul paginii sau al unei secțiuni |
| `<section>` / `<article>` | regiuni de conținut (cu titlu) |
</script>
</section>

<section class="lesson" id="s2" data-num="2" data-title="Landmark-uri: header, nav, main, footer">
<script type="text/markdown">
### 2.1. Scheletul tipic al unei pagini

```text
body
├── header          ← logo, titlu site, uneori nav
│   └── nav         ← meniul principal (poate fi și în afara header)
├── main            ← UN SINGUR main pe pagină
│   ├── section…
│   └── article…
├── aside           ← opțional: legături laterale, publicitate contextuală
└── footer          ← copyright, linkuri secundare, contact
```

### 2.2. Reguli practice

| Element | Reguli |
|---|---|
| `<header>` | Antetul **paginii** sau al unui `article`/`section`. Nu e obligatoriu să conțină `nav`. |
| `<nav>` | Doar pentru **blocuri de navigare** (meniu principal, cuprins, breadcrumb). Nu înfășura fiecare listă de linkuri în `nav`. |
| `<main>` | **Unul** pe document (fără a număra pe cele din `template` / ascunse). Nu pune `main` în `article`/`aside`. |
| `<footer>` | Subsolul paginii sau al unei secțiuni. Poate conține `nav` secundar. |

> [!TIP] Poți avea mai multe `header` / `footer` / `nav` pe pagină — câte unul per regiune. Nu poți avea mai multe `main` vizibile.
</script>

<section class="lesson" id="s3" data-num="3" data-title="section, article, aside">
<script type="text/markdown">
### 3.1. `<section>` vs `<article>`

Ambele grupează conținut legat tematic și **ar trebui să aibă un titlu** (`h2`–`h6`).

| | `<section>` | `<article>` |
|---|---|---|
| Sens | o **secțiune** a paginii (parte dintr-un întreg) | un bloc **de sine stătător** (ar putea fi redistribuit singur) |
| Exemple | „Despre noi”, „Servicii”, „Contact” | post pe blog, card de produs, comentariu, știre |
| Independent? | nu neapărat | da — are sens și scos din context |

### 3.2. `<aside>`

Conținut **complementar**: tipuri, legături înrudite, glosar, publicitate legată de pagină. Dacă scoți `aside`-ul, conținutul din `main` trebuie să rămână înțeles.

### 3.3. Greșeli frecvente

- a înfășura tot body-ul într-un singur `section` fără titlu;
- a folosi `article` pentru orice „cutie” vizuală (card stilizat) fără conținut independent;
- a pune navigarea principală în `aside` doar pentru că „e pe laterală”.
</script>

<section class="lesson" id="s4" data-num="4" data-title="Alte elemente semantice utile">
<script type="text/markdown">
### 4.1. Figuri, timp, adresă

| Element | Rol |
|---|---|
| `<figure>` + `<figcaption>` | imagine / diagramă / citat cu legendă legată de el |
| `<time datetime="…">` | dată/oră; `datetime` e forma lizibilă de mașină |
| `<address>` | date de contact ale autorului paginii / articolului (nu orice adresă poștală din text) |
| `<search>` | (HTML recent) zona formularului de căutare pe site |
</script>

<script type="text/markdown">
### 4.2. `div`, `span` și când nu folosești `section`

`<div>` și `<span>` sunt **recipiente generice**: nu au sens semantic propriu. Le folosești când ai nevoie de o cutie pentru stil sau layout, dar nu există un element HTML care să descrie mai bine grupul.

| | `<div>` | `<span>` |
|---|---|---|
| Tip | **bloc** — ocupă (de obicei) toată lățimea, începe pe rând nou | **în linie (inline)** — stă în fluxul textului |
| Exemplu tipic | un rând cu două coloane, un card-container pentru CSS | evidențiezi câteva cuvinte în interiorul unui paragraf |
| Conține | alte blocuri, liste, formulare… | de obicei text sau elemente inline |

**`div` vs `section`:**

- folosește **`section`** când grupul are o **temă clară** și un **titlu** (`h2`–`h6`) — e o parte a documentului;
- folosește **`div`** când grupezi doar pentru CSS (flex/grid, fundal, spațiere) și grupul **nu** merită un titlu în cuprinsul paginii.

> [!TIP] Nu „promova” un `div` la `section` doar ca să arate bine în inspector. Fără titlu și fără temă, `section` e folosit greșit — rămâi la `div`.
</script>
