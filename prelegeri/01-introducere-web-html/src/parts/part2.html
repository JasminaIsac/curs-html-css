<section class="lesson" id="s3" data-num="3" data-title="Istoria HTML și rolul W3C / WHATWG">
<script type="text/markdown">
### 3.1. Ce este HTML?

**HTML** (*HyperText Markup Language*) este limbajul de **marcare** cu care descrii structura unei pagini web: titluri, paragrafe, liste, linkuri, imagini etc.

- Nu este un limbaj de programare (nu are „logică” ca variabilele sau buclele — asta e rolul JavaScript).
- **Marchezi** conținutul cu etichete (`<h1>`, `<p>`, `<a>`…); browserul interpretează etichetele și afișează pagina.
- **HyperText** = text legat de alte resurse prin hiperlinkuri — ideea fondatoare a web-ului.

### 3.2. De la idee la HTML5

| An (aprox.) | Moment |
|---|---|
| 1991 | Tim Berners-Lee publică primele etichete HTML |
| 1995 | HTML 2.0 — primul standard „oficial” |
| 1997–1999 | HTML 3.2 / 4.0 / 4.01 — tabele, formulare, frame-uri |
| ~2000 | XHTML 1.0 — HTML reformulat în XML (strictețe) |
| 2004+ | WHATWG pornește HTML „viu” (living standard) |
| 2014 | **HTML5** recomandare W3C |
| azi | HTML = *living standard* WHATWG; HTML5 = numele uzual al standardului curent |

```text
1991        1995      1997–99      ~2000       2004+        2014         azi
  |           |          |           |           |            |           |
  ●───────────●──────────●───────────●───────────●────────────●───────────●──→
 început    HTML 2    HTML 3/4     XHTML      WHATWG      HTML5     Living
  HTML                                                              Standard
```

### 3.3. W3C și WHATWG

| Organizație | Rol |
|---|---|
| **W3C** (*World Wide Web Consortium*) | Consorțiu care publică specificații (HTML, CSS, accesibilitate…). Site: [w3.org](https://www.w3.org/) |
| **WHATWG** (*Web Hypertext Application Technology Working Group*) | Menține **HTML Living Standard** — sursa de adevăr pentru HTML modern: [html.spec.whatwg.org](https://html.spec.whatwg.org/) |

Practic: înveți HTML5 / living standard (semantica modernă, `<!DOCTYPE html>`, API-uri din browser). Validatorul și MDN urmează această linie.

> [!INFO] Nu trebuie să memorezi anii. Reține: HTML5 e standardul curent; specificația evoluează continuu (WHATWG), iar W3C rămâne un actor important al ecosistemului web.
</script>
</section>

<section class="lesson" id="s4" data-num="4" data-title="Structura unui document HTML">
<script type="text/markdown">
### 4.1. Scheletul minimal HTML5

Orice pagină modernă pornește de la același schelet:

```html
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Titlul în tab</title>
</head>
<body>
    <h1>Conținutul vizibil</h1>
    <p>Paragraf pe pagină.</p>
</body>
</html>
```

| Element | Rol |
|---|---|
| `<!DOCTYPE html>` | Declară modul **HTML5** (nu e un tag clasic; stă pe prima linie) |
| `<html>` | Rădăcina documentului; `lang="ro"` ajută accesibilitatea și SEO |
| `<head>` | **Metadate** — nu se văd ca text pe pagină |
| `<body>` | Tot ce e vizibil (și majoritatea scripturilor interactive) |

> [!TIP] Salvează fișierul cu extensia `.html` (sau `.htm`) și deschide-l în browser (dublu-clic sau Live Preview din editor).

### 4.2. Arborele documentului

Documentul este un **arbore**: `html` are doi copii principali (`head`, `body`), iar în `body` imbrici titluri, paragrafe, liste etc. Browserul nu afișează „tag-uri”, ci construiește noduri în DOM.
</script>

<section class="lesson" id="s5" data-num="5" data-title="Metadate și codificarea UTF-8">
<script type="text/markdown">
### 5.1. Ce stă în `<head>`

Conținutul din `head` descrie documentul, nu „textul paginii”:

| Element / atribut | Rol |
|---|---|
| `<title>` | Titlul din tab, istoric, rezultate de căutare |
| `<meta charset="UTF-8">` | Codificarea caracterelor (diacritice: ă â î ș ț) |
| `<meta name="description" content="…">` | Rezumat scurt (deseori în Google) |
| `<meta name="author" content="…">` | Autor |
| `<meta name="viewport" …>` | Adaptare pe mobil |
| `<link rel="icon" href="…">` | Favicon |
| `<link rel="stylesheet" href="…">` | CSS extern (în lecțiile următoare) |

`keywords` există istoric, dar motoarele moderne îl ignoră aproape complet — concentrează-te pe `title` și `description`.

### 5.2. De ce UTF-8

Fără `charset` corect (sau dacă fișierul e salvat în altă codificare), diacriticele apar ca `Äƒ`, `ÅŸ`, romburi etc.

Regula practică:

1. Prima linie utilă din `head`: `<meta charset="UTF-8">` (înainte de text cu diacritice).
2. Salvează fișierul ca **UTF-8** în editor.
3. Verifică în browser: View Page Source / Encoding.

```html
<head>
    <meta charset="UTF-8">
    <title>Laborator HTML — USM</title>
    <meta name="description" content="Introducere în structura unui document HTML5.">
    <meta name="author" content="Studenta Ana">
</head>
```

> [!WARN] Dacă `title` sau un paragraf cu „ș” apare înainte de `meta charset`, unele browsere ghicesc greșit codificarea. Pune charset-ul imediat după `<head>`.
</script>
