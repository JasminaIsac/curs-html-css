<section class="lesson" id="s0" data-num="0" data-title="Structura cursului">
<script type="text/markdown">
### 0.1. Nota generală

Nota finală la disciplină se calculează astfel:

**Nota generală** = `0,6 × Media semestrială` + `0,4 × Examen`

### 0.2. Media semestrială

Media semestrială este media aritmetică a **patru** componente:

| Componentă | Ce reprezintă |
|---|---|
| **Testare 1** | Prima evaluare teoretică / practică pe parcurs |
| **Testare 2** | A doua evaluare pe parcurs |
| **Media curentă** | Media notelor la **lucrările de laborator** |
| **Lucru individual (LI)** | Proiectul / tema individuală |

```text
Media semestrială = (Testare 1 + Testare 2 + Media curentă + LI) / 4
```

### 0.3. Laboratoare și lucru individual

În acest semestru:

| Activitate | Număr | Rol în notare |
|---|---|---|
| Lucrări de laborator | **2** | formează **Media curentă** (media celor două note) |
| Lucru individual (LI) | **1** | notă separată în media semestrială |

> [!INFO] Media curentă = media celor 2 lucrări de laborator. LI-ul nu intră în media curentă — este a patra componentă a mediei semestriale, alături de Testare 1, Testare 2 și Media curentă.
</script>
</section>

<section class="lesson" id="s1" data-num="1" data-title="Cum funcționează web-ul">
<script type="text/markdown">
### 1.1. Client, server și resurse

Web-ul este un sistem de **client–server**:

| Rol | Ce este | Exemplu |
|---|---|---|
| **Client** | Programul care *cere* resurse | browserul tău (Chrome, Firefox, Edge, Safari) |
| **Server** | Calculator (sau serviciu) care *răspunde* cu resurse | un calculator dintr-un centru de date care găzduiește `usm.md` |
| **Resursă** | Fișier sau răspuns generat | pagină HTML, imagine, CSS, JSON, PDF |

Tu nu „descarci internetul”: trimiți o **cerere** către o adresă, iar serverul îți trimite un **răspuns**.

### 1.2. Browserul

Browserul este clientul pe care îl vezi: citește HTML, aplică CSS, rulează JavaScript, gestionează cookie-uri, cache și securitate. În DevTools (F12) poți urmări exact ce cereri face.

### 1.3. URL — adresa resursei

Un **URL** (*Uniform Resource Locator*) spune *unde* și *cum* se ajunge la o resursă:

```text
https://www.exemplu.ro:443/cursuri/html/index.html?an=1#capitol-2
└─┬──┘  └──────┬──────┘ └┬┘ └──────────┬──────────┘ └──┬──┘ └───┬───┘
 schemă      gazdă     port         cale             query  fragment
```

| Parte | Rol |
|---|---|
| `https` | **schemă** (protocolul) |
| `www.exemplu.ro` | **gazdă** (nume de domeniu → IP prin DNS) |
| `:443` | **port** (implicit 443 pentru HTTPS, 80 pentru HTTP) |
| `/cursuri/html/index.html` | **cale** pe server |
| `?an=1` | **query** — parametri |
| `#capitol-2` | **fragment** — ancora din pagină (nu se trimite la server) |

### 1.4. HTTP — limba cererilor

**HTTP** (*HyperText Transfer Protocol*) este protocolul prin care clientul și serverul schimbă mesaje. O cerere tipică:

1. Browserul rezolvă domeniul prin **DNS** (nume → adresă IP).
2. Deschide o conexiune (TCP; pentru HTTPS + TLS).
3. Trimite o **cerere HTTP** (metodă + cale + antete).
4. Serverul răspunde cu un **cod de stare** și un corp (HTML, imagine…).

Metode frecvente: `GET` (citește), `POST` (trimite date), `PUT` / `PATCH` (actualizează), `DELETE` (șterge).

Coduri de stare utile:

| Cod | Semnificație |
|---|---|
| `200` | OK — resursa a fost trimisă |
| `301` / `302` | redirecționare |
| `404` | nu există |
| `500` | eroare pe server |
</script>

<section class="lesson" id="s2" data-num="2" data-title="HTTP, HTTPS și rolul browserului">
<script type="text/markdown">
### 2.1. HTTP vs HTTPS

| | HTTP | HTTPS |
|---|---|---|
| Port implicit | 80 | 443 |
| Criptare | nu | da (TLS) |
| Integritate | vulnerabil la modificare pe drum | protejat |
| Autenticitate | oricine poate pretinde că e site-ul | certificat verificat |

**HTTPS** = HTTP + **TLS** (criptare pe canal). Lacătul din bara de adrese nu garantează că site-ul e „de încredere” moral, ci că conexiunea e criptată către serverul care deține certificatul.

> [!WARN] Nu introduce parole pe pagini servite pe `http://` — traficul poate fi citit pe rețele publice.

### 2.2. Ce face browserul cu răspunsul

1. Primește HTML-ul.
2. Construiește **DOM**-ul (arborele de elemente).
3. Încarcă CSS, imagini, scripturi (alte cereri HTTP).
4. Calculează layout-ul și **pictează** pagina.
5. Reactualizează la interacțiuni (clic, scroll, JS).
</script>
