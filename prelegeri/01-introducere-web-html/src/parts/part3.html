<section class="lesson" id="s6" data-num="6" data-title="Elemente, atribute, imbricare, comentarii, entități">
<script type="text/markdown">
### 6.1. Element = tag + conținut (+ atribute)

Un **element** are de obicei formă:

```html
<p class="intro" id="p1">Textul paragrafului</p>
│ │                │              │
│ nume tag         atribute       conținut
│                                 tag de închidere
```

- **Tag de deschidere** / **de închidere**: `<p>` … `</p>`
- **Elemente vide** (fără conținut): `<br>`, `<hr>`, `<img>`, `<meta>` — în HTML5 se scriu fără slash obligatoriu: `<br>` sau `<br />`
- **Atribute**: `nume="valoare"` (sau `nume='valoare'`); unele sunt booleene: `reversed`, `disabled`

### 6.2. Imbricarea (nesting)

Elementele se **imbrică** ca cutii: copilul stă complet în părinte. Greșit: a închide părintele înaintea copilului.

```html
<!-- corect -->
<p>Citește <strong>cu atenție</strong> acum.</p>

<!-- greșit -->
<p>Citește <strong>cu atenție</p></strong>
```

### 6.3. Comentarii

Comentariile nu apar pe pagină; folosesc pentru note sau pentru a dezactiva temporar markup:

```html
<!-- TODO: adaugă secțiunea contact -->
```

Nu pune `--` în interiorul comentariului. Nu comenta fragmente care sparg imbricarea.

> [!TIP] **Bonus — scurtături în editor (VS Code / Cursor, Windows)**  
> Selectează una sau mai multe linii, apoi:  
> - `Ctrl` + `/` — comută comentariul HTML (`<!-- … -->`) pe selecție  
> - `Shift` + `Alt` + `A` — comentariu pe bloc (alternativă, în funcție de limbă)  
> Apasă din nou aceeași combinație ca să **decomentezi**. Pe macOS: `Cmd` + `/` în loc de `Ctrl` + `/`.

### 6.4. Entități

Unele caractere trebuie scrise ca **entități**, altfel browserul le ia drept markup:

| Entitate | Caracter | Când |
|---|---|---|
| `&lt;` | `<` | afișezi un „mai mic” ca text |
| `&gt;` | `>` | similar |
| `&amp;` | `&` | ampersand în text sau URL afișat |
| `&quot;` | `"` | ghilimele în atribute rareori |
| `&nbsp;` | spațiu neîntrerupt | spațiu care nu rupe rândul |
| `&copy;` | © | simbol copyright |

În textul „5 &lt; 10” folosești `&lt;`, nu `<`.
</script>

### 7.1. Titluri `<h1>`–`<h6>`

| Tag | Rol tipic |
|---|---|
| `<h1>` | Titlul principal al paginii (de regulă unul) |
| `<h2>` | Secțiuni majore |
| `<h3>`–`<h6>` | Subsecțiuni, tot mai adânci |

### 7.2. Paragrafe, rând nou, separator

| Tag | Rol |
|---|---|
| `<p>` | Paragraf (bloc de text) |
| `<br>` | Forțează un **rând nou** în același flux (folosește rar) |
| `<hr>` | Separator tematic (linie orizontală) |
| `<pre>` | Păstrează spațiile și rândurile (ex. fragmente de cod ASCII) |

> [!TIP] Pentru spațiere verticală între idei, preferă paragrafe separate (`<p>`) sau CSS, nu lanțuri de `<br><br>`.

<section class="lesson" id="s8" data-num="8" data-title="Accentuare, citate și liste">
<script type="text/markdown">
### 8.1. Accentuare și semantică inline

| Tag | Semnificație (preferat) | Aspect tipic |
|---|---|---|
| `<strong>` | importanță / seriozitate | îngroșat |
| `<em>` | accent / ton | italic |
| `<b>`, `<i>` | îngroșat / italic **fără** semantică puternică | vizual |
| `<mark>` | evidențiere (ex. rezultat căutare) | fundal galben |
| `<code>` | fragment de cod | monospace |
| `<sup>` / `<sub>` | exponent / indice | x², H₂O |
| `<ins>` / `<del>` | inserat / șters | subliniat / tăiat |
| `<abbr title="…">` | abreviere | puncte sub text |

Preferă `<strong>` / `<em>` când vrei sens, nu doar aspect.
</script>

<script type="text/markdown">
### 8.3. Liste

| Elemente | Tip | Când |
|---|---|---|
| `<ul>` + `<li>` | **neordonată** (buline) | ordine indiferentă: ingrediente, linkuri din meniu |
| `<ol>` + `<li>` | **ordonată** (1, 2, 3…) | pași, ranking, reguli în ordine |
| `<dl>` + `<dt>` + `<dd>` | **definiții** | termen → explicație (glosar) |

Atribute pe `<ol>`:

| Atribut | Efect | Exemple |
|---|---|---|
| `type` | stilul numerotării | `"1"` cifre, `"a"` / `"A"` litere, `"i"` / `"I"` romane |
| `start` | de la ce număr începe | `start="3"` → 3, 4, 5… |
| `reversed` | numerotare descrescătoare | 3, 2, 1 (fără valoare: doar prezența atributului) |

Listele se pot **imbrica**: o `<ul>` sau `<ol>` în interiorul unui `<li>`.
</script>

  const btn = e.target.closest("button[data-type]");
  if (!btn) return;
  document.querySelectorAll("button[data-type]").forEach((b) => b.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  ol.setAttribute("type", btn.dataset.type);
  sync();
});
startInp.addEventListener("input", () => {
  const v = Math.max(1, parseInt(startInp.value, 10) || 1);
  startInp.value = v;
  ol.setAttribute("start", String(v));
  sync();
});
revBtn.addEventListener("click", () => {
  const on = revBtn.getAttribute("aria-pressed") !== "true";
  revBtn.setAttribute("aria-pressed", on ? "true" : "false");
  if (on) ol.setAttribute("reversed", "");
  else ol.removeAttribute("reversed");
  sync();
});
document.getElementById("add-ol").addEventListener("click", () => {
  const li = document.createElement("li");
  li.textContent = pasi[pi % pasi.length];
  pi++;
  ol.appendChild(li);
});
document.getElementById("del-ol").addEventListener("click", () => {
  if (ol.children.length > 1) ol.lastElementChild.remove();
});
sync();
</script>
</div>
